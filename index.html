const campAtual=()=>DB.get('campanhas',$('[data-camp]')?.dataset.camp||$('#view').dataset.id);
A.excluirCamp=()=>{const c=campAtual();if(!confirmar(`Excluir a campanha “${c.nome}”? As fichas continuam salvas.`))return;DB.remove('campanhas',c.id);go('#/campanhas')};
A.entrarCodigo=async el=>{const v=$('#codigoIn').value.trim().toUpperCase();if(!v)return toast('Digite o código.');
  el.disabled=true;const r=await sb.rpc('entrar_campanha_por_codigo',{p_codigo:v});el.disabled=false;
  if(r.error)return toast(r.error.message);await DB.carregar();toast('Você entrou na campanha. Adicione sua ficha nela.');go('#/campanha/'+r.data)};
A.sairCamp=async()=>{const c=campAtual();if(!confirmar(`Sair da campanha “${c.nome}”?`))return;
  const r=await sb.from('campanha_membros').delete().eq('campanha_id',c.id).eq('user_id',DB.data.user.id);if(r.error)return toast(r.error.message);
  await DB.carregar();go('#/campanhas')};
A.copiarCodigo=()=>{const c=campAtual();navigator.clipboard?.writeText(c.codigo).then(()=>toast('Código copiado.'),()=>prompt('Código:',c.codigo))};
A.addCamp=el=>{const c=campAtual();const k=el.dataset.k;const tipo=k==='rivais'?'npc':'jogador';
  const mestre=c.ownerId===DB.data.user.id;
  const ok=f=>f.tipo===tipo&&DB.mine(f)&&!(c[k]||[]).includes(f.id);
  if(mestre){escolherFicha(k==='rivais'?'Adicionar rival':'Adicionar ficha de jogador',f=>{c[k]=[...new Set([...(c[k]||[]),f.id])];DB.upsert('campanhas',c);rerender()},ok);return}
  escolherFicha('Adicionar sua ficha',async f=>{const r=await sb.from('campanha_fichas').insert({campanha_id:c.id,ficha_id:f.id,papel:'jogadores'});if(r.error)return toast(r.error.message);await DB.carregar();rerender()},ok)};
A.tirarDaCamp=el=>{const c=campAtual();c[el.dataset.k]=c[el.dataset.k].filter(i=>i!==el.dataset.id);DB.upsert('campanhas',c);rerender()};
A.partidaDaCamp=()=>{const c=campAtual();if(!DB.data.partida)prefillDaCampanha(c);go('#/partida')};
// escudo
const fichaEsc=el=>DB.get('fichas',el.dataset.id);
A.escFol=el=>{const f=fichaEsc(el);const dv=derived(f);f.folegoAtual=el.dataset.v==='max'?dv.folMax:clamp(fol(f)+(+el.dataset.v),0,dv.folMax);DB.upsert('fichas',f);syncPartida(f);rerender()};
A.escPe=el=>{const f=fichaEsc(el);f.peAtual=clamp(pe(f)+(+el.dataset.v),0,derived(f).peMax);DB.upsert('fichas',f);syncPartida(f);rerender()};
A.escCond=el=>{const f=fichaEsc(el);const c=el.dataset.v;f.condicoes=(f.condicoes||[]).includes(c)?f.condicoes.filter(x=>x!==c):[...(f.condicoes||[]),c];DB.upsert('fichas',f);rerender()};
function syncPartida(f){const M=DB.data.partida;if(!M)return;Object.values(M.parts).forEach(p=>{if(p.fichaId===f.id&&p.tipo==='jogador'){p.folego=fol(f);p.pe=pe(f)}})}
A.todosDescansam=()=>{const c=campAtual();if(!confirmar('Restaurar Fôlego e PE de todas as fichas da campanha?'))return;[...(c.jogadores||[]),...(c.rivais||[])].forEach(i=>{const f=DB.get('fichas',i);if(f){f.folegoAtual=null;f.peAtual=null;DB.upsert('fichas',f);syncPartida(f)}});rerender();toast('Fôlego e PE restaurados.')};
A.rolagemRapida=()=>{const f=DB.get('fichas',$('#qrF').value);if(!f)return toast('Adicione fichas à campanha.');const dv=derived(f);mostrarTray(rolar({nome:f.nome,status:f.status,tecnicas:f.tecnicas,tec:$('#qrT').value,extra:+$('#qrB').value||0,ov:dv.o,fichaId:f.id}))};
// partida — preparação
A.mAdd=el=>{const s=setupPartida();const t=el.dataset.t,o=t==='A'?'B':'A',id=el.dataset.id;const f=DB.get('fichas',id);
  if(f.tipo==='jogador'){delete s[o].sel[id];s[t].sel[id]=1}else s[t].sel[id]=Math.min(11,(s[t].sel[id]||0)+1);rerender()};
A.mQty=el=>{const s=setupPartida();const t=el.dataset.t,id=el.dataset.id;const v=(s[t].sel[id]||0)+(+el.dataset.v);if(v<=0)delete s[t].sel[id];else s[t].sel[id]=Math.min(11,v);rerender()};
A.mIniciar=()=>iniciarPartida();
// partida — ao vivo
const P_=el=>M_().parts[el.dataset.id];
A.mNext=()=>proximoTurno();
A.mSel=el=>{M_().sel=el.dataset.id;rerender()};
A.mPlacar=el=>{const M=M_();M.times[el.dataset.t].gols=Math.max(0,M.times[el.dataset.t].gols+(+el.dataset.v));DB.saveSoon();rerender()};
A.mFol=el=>{const p=P_(el);mudarFolego(p,el.dataset.v);DB.saveSoon();rerender()};
A.mPe=el=>{const p=P_(el);p.pe=clamp(p.pe+(+el.dataset.v),0,p.peMax);syncFicha(p);DB.saveSoon();rerender()};
A.mBonus=el=>{const p=P_(el);const v=prompt(`Bônus para o próximo teste de ${p.nome}:`,p.bonusNext||0);if(v===null)return;p.bonusNext=+v||0;DB.saveSoon();rerender()};
A.mAcao=el=>{const p=P_(el);const k=el.dataset.k,i=+el.dataset.i;p.acoes[k]=i<p.acoes[k]?i:i+1;DB.saveSoon();rerender()};
A.mCond=el=>{const p=P_(el);const c=el.dataset.v;p.cond=p.cond.includes(c)?p.cond.filter(x=>x!==c):[...p.cond,c];DB.saveSoon();rerender()};
A.mArma=el=>usarArmaPartida(P_(el),el.dataset.a);
A.mPosse=el=>darPosse(el.dataset.id);
A.mOut=el=>{const p=P_(el);p.out=!p.out;logM(`${p.nome} ${p.out?'saiu de campo':'voltou a campo'}.`);DB.saveSoon();rerender()};
A.mGol=el=>registrarGol(el.dataset.id);
A.mBloq=el=>{const p=P_(el);p.st.bloq++;logM(`Bloqueio crucial de ${p.nome}!`,'goal');duelo().res=null;DB.saveSoon();rerender()};
A.mDuelA=el=>{const D=duelo();D.a=el.dataset.id;D.res=null;if(D.d===D.a)D.d='';rerender()};
A.mDuelD=el=>{const D=duelo();D.d=el.dataset.id;D.res=null;if(D.d===D.a)D.a=atual().iid;DB.saveSoon();rerender()};
A.mPreset=el=>{const M=M_(),D=duelo(),pr=PRESETS[+el.dataset.i];const a=M.parts[D.a],b=M.parts[D.d];D.ta=a?melhorTec(a,pr.a):pr.a[0];D.td=b?melhorTec(b,pr.d):pr.d[0];D.res=null;rerender()};
A.mRolar=()=>rolarDuelo();
A.mEscudo=()=>{const M=M_();M.escudo=!M.escudo;DB.saveSoon();rerender()};
A.mRestaurar=()=>{const M=M_();if(!confirmar('Restaurar Fôlego e PE de todos (em campo e da campanha)?'))return;
  Object.values(M.parts).forEach(p=>{p.folego=p.folMax;p.pe=p.peMax;syncFicha(p)});
  const c=M.campanhaId&&DB.get('campanhas',M.campanhaId);if(c)[...(c.jogadores||[]),...(c.rivais||[])].forEach(i=>{const f=DB.get('fichas',i);if(f&&!Object.values(M.parts).some(p=>p.fichaId===f.id)){f.folegoAtual=null;f.peAtual=null;DB.upsert('fichas',f)}});
  logM('Fôlego e PE restaurados.');DB.saveSoon();rerender()};
A.mTec=el=>{const M=M_();const p=M.parts[el.dataset.id];const t=el.dataset.t;
  const usar=gastarEgo(p,$('#mEgo')?.checked);const intim=p.cond.includes('Intimidado')||intimidadoPassivo(p);
  const r=rolar({nome:p.nome,status:p.status,tecnicas:p.tecnicas,tec:t,extra:p.bonusNext,ego:usar,egoDie:p.egoDie,penal:intim?M.penal:0,ov:p.ov,fichaId:p.fichaId,fonte:'partida'});
  p.bonusNext=0;syncFicha(p);logM(`${p.nome} testou ${t}: ${r.total}.`);mostrarTray(r);DB.saveSoon();rerender()};
A.mFim=()=>encerrarPartida();

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==='A'&&el.getAttribute('href'))return;
  ev.preventDefault();fn(el,ev);
});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest('input,textarea,select')||ev.metaKey||ev.ctrlKey||ev.altKey||$('.modal'))return;
  if(ev.key==='Enter'&&ev.target.matches('[role=button][data-act]')){ev.target.click();return}
  if(!DB.data.partida||$('#view').dataset.route!=='partida')return;
  if(ev.key==='n'||ev.key==='N'){ev.preventDefault();proximoTurno()}
  if(ev.key==='d'||ev.key==='D'){ev.preventDefault();rolarDuelo()}
  if(ev.key==='e'||ev.key==='E'){ev.preventDefault();A.mEscudo()}
});
function refocar(sel){const i=$(sel);if(i){i.focus();const v=i.value;i.value='';i.value=v}}
const INPUT_ACTS={
  buscaFichas:v=>{listaFichas.q=v;rerender();refocar('[data-act-input="buscaFichas"]')},
  buscaEstilo:v=>{ROUTES.estilos.st.q=v;rerender();refocar('[data-act-input="buscaEstilo"]')},
  buscaBib:v=>{ROUTES.biblioteca.st.q=v;rerender();refocar('[data-act-input="buscaBib"]')}
};
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.actInput){INPUT_ACTS[t.dataset.actInput]?.(t.value);return}
  if(t.dataset.f){const f=fichaAtual();if(!f)return;let v=t.type==='number'?(t.value===''?0:+t.value):t.value;
    if(t.dataset.f.startsWith('status.'))v=clamp(Math.round(v),0,110);
    setPath(f,t.dataset.f,v);DB.upsert('fichas',f);atualizarDerivados(f);return}
  if(t.dataset.e){const e=estiloAtual();if(!e)return;let v=t.type==='number'?clamp(+t.value||0,0,110):t.value;setPath(e,t.dataset.e,v);DB.upsert('estilos',e);
    const ps=sumStats(e.status);const b=$('[data-d="eps"]');if(b){b.style.width=clamp(ps/2.8,0,100)+'%';b.style.background=ps>280?'var(--red)':ps===280?'var(--green)':'var(--lock)'}
    const tt=$('[data-d="epst"]');if(tt){const acima=STATS.filter(s=>+e.status[s.k]>55).map(s=>s.s);tt.textContent=`${ps} / 280${acima.length?' · acima de 55: '+acima.join(', '):''}`}
    const pv=$('[data-d="eprev"]');if(pv)pv.innerHTML=cardEstilo(e,'noop');return}
  if(t.dataset.c){const c=campAtual();c[t.dataset.c]=t.value;DB.upsert('campanhas',c);return}
  if(t.dataset.ms){const s=setupPartida();const k=t.dataset.ms;if(k==='A'||k==='B')s[k].nome=t.value;else if(k==='penal')s.penal=+t.value||0;else if(k==='cansaco')s.cansaco=t.checked;else if(k==='escudo')s.escudo=t.checked;return}
  if(t.dataset.mt){M_().times[t.dataset.mt].nome=t.value;DB.saveSoon();return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.actChange==='publicarEstilo'){const e=DB.get('estilos',t.dataset.id);e.publicado=t.checked;DB.upsert('estilos',e);toast(t.checked?'Estilo publicado para todos.':'Estilo voltou a ser rascunho.');if(!$('.modal'))rerender();return}
  if(t.dataset.actChange==='publicarBib'){const x=DB.get('biblioteca',t.dataset.id);x.publicado=t.checked;DB.upsert('biblioteca',x);toast(t.checked?'Publicado para todos.':'Agora só você vê.');rerender();return}
  if(t.dataset.actChange==='mEscudo'){M_().escudo=t.checked;DB.saveSoon();rerender();return}
  if(t.dataset.actChange==='escudoRivais'){ROUTES.escudo.st.rivais=t.checked;rerender();return}
  if(t.dataset.actChange==='mCamp'){const c=DB.get('campanhas',t.value);if(c)prefillDaCampanha(c);else setupPartida().campanhaId='';rerender();return}
  if(t.dataset.md){const D=duelo();const k=t.dataset.md;D[k]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value||0:t.value;D.res=null;
    const M=M_();if(k==='a'&&M.parts[D.a]&&!ALL_TEC.includes(D.ta))D.ta='Drible';DB.saveSoon();rerender();return}
  if(t.dataset.mfol){const p=M_().parts[t.dataset.mfol];mudarFolego(p,+t.value||0);DB.saveSoon();rerender();return}
});

/* ---------- login e importação ---------- */
const normalizarUsuario=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'');
const emailDe=u=>`${u}@bluelockrpg.app`;
function authMsg(t,ok=false){const m=$('#authMsg');m.textContent=t;m.style.color=ok?'var(--green)':'var(--red)'}
function authOcupado(b){$$('#authForm button').forEach(x=>x.disabled=b)}
async function acaoAuth(criar){
  const bruto=$('#authUser').value,u=normalizarUsuario(bruto),s=$('#authPass').value;
  if(u.length<3||u.length>24)return authMsg('Use um usuário de 3 a 24 letras, números, ponto, hífen ou sublinhado.');
  if(s.length<6)return authMsg('A senha precisa ter pelo menos 6 caracteres.');
  authOcupado(true);authMsg('');
  try{
    if(criar){
      const r=await sb.auth.signUp({email:emailDe(u),password:s,options:{data:{nome:bruto.trim()||u}}});
      if(r.error)throw r.error;
      if(!r.data.session){authMsg('Conta criada, mas o Supabase está pedindo confirmação de e-mail. Desative em Authentication → Sign In / Providers → Email → “Confirm email” e entre de novo.');return}
      await entrar(r.data.session);
    }else{
      const r=await sb.auth.signInWithPassword({email:emailDe(u),password:s});
      if(r.error)throw r.error;
      await entrar(r.data.session);
    }
  }catch(e){
    const m=String(e.message||e);
    authMsg(/invalid login/i.test(m)?'Usuário ou senha incorretos.':/already registered/i.test(m)?'Esse usuário já existe. Use “Entrar”.':/email not confirmed/i.test(m)?'O Supabase está pedindo confirmação de e-mail. Desative “Confirm email” nas configurações de Authentication.':m);
  }finally{authOcupado(false)}
}
async function importarLocal(){
  const raw=localStorage.getItem('bluelock_rpg_v1');if(!raw)return;
  let L;try{L=JSON.parse(raw)}catch(_){return}
  $('#authMsg').textContent='Importando dados deste navegador…';
  const map={};const novo=()=>uid();
  (L.estilos||[]).forEach(e=>{if(e.oficial){const s=DB.list('estilos').find(x=>x.oficial&&x.nome===e.nome);if(s)map[e.id]=s.id}else map[e.id]=novo()});
  (L.biblioteca||[]).forEach(b=>{if(b.oficial){const s=DB.list('biblioteca').find(x=>x.oficial&&x.nome===b.nome);if(s)map[b.id]=s.id}else map[b.id]=novo()});
  (L.fichas||[]).forEach(f=>map[f.id]=novo());
  let txt=JSON.stringify({fichas:L.fichas||[],estilos:(L.estilos||[]).filter(e=>!e.oficial),biblioteca:(L.biblioteca||[]).filter(b=>!b.oficial),campanhas:L.campanhas||[],partida:L.partida||null});
  Object.keys(map).sort((a,b)=>b.length-a.length).forEach(o=>{if(o)txt=txt.split(o).join(map[o])});
  const D=JSON.parse(txt);const eu=DB.data.user;
  const limpar=o=>{delete o.autorId;delete o.autorNome;delete o.oficial;return o};
  D.estilos.forEach(e=>DB.upsert('estilos',limpar(e)));
  D.biblioteca.forEach(b=>DB.upsert('biblioteca',limpar(b)));
  D.fichas.forEach(f=>DB.upsert('fichas',limpar(f)));
  await DB.flush();
  const campMap={};let falhas=0;
  for(const c of D.campanhas){
    try{const n=await DB.criarCampanha(c.nome||'Campanha',c.descricao||'',c.cor);campMap[c.id]=n.id;
      n.notas=c.notas||'';n.partidas=c.partidas||[];
      n.jogadores=(c.jogadores||[]).filter(i=>DB.get('fichas',i));n.rivais=(c.rivais||[]).filter(i=>DB.get('fichas',i));
      DB.upsert('campanhas',n);}catch(e){console.warn(e);falhas++}
  }
  await DB.flush();
  if(!falhas)localStorage.setItem('bluelock_campanhas_ok_'+eu.id,'1');
  if(D.partida&&!localStorage.getItem('bluelock_partida_'+eu.id)){D.partida.campanhaId=campMap[D.partida.campanhaId]||'';DB.data.partida=D.partida;DB.save()}
  localStorage.setItem('bluelock_rpg_v1_importado',raw);localStorage.removeItem('bluelock_rpg_v1');
  setTimeout(()=>toast(`Importado: ${plural(D.fichas.length,'ficha','fichas')}, ${plural(D.estilos.length,'estilo','estilos')}, ${plural(D.campanhas.length,'campanha','campanhas')}.`),600);
}
// Recupera campanhas que não puderam ser criadas numa importação anterior
async function recuperarCampanhas(){
  const eu=DB.data.user;const flag='bluelock_campanhas_ok_'+eu.id;
  const raw=localStorage.getItem('bluelock_rpg_v1_importado');if(!raw||localStorage.getItem(flag))return;
  let L;try{L=JSON.parse(raw)}catch(_){return}
  const antigas=L.campanhas||[];if(!antigas.length){localStorage.setItem(flag,'1');return}
  const minhas=DB.list('fichas',f=>DB.mine(f));
  const achar=oldId=>{const o=(L.fichas||[]).find(f=>f.id===oldId);if(!o)return null;return minhas.find(f=>f.tipo===o.tipo&&f.nome===o.nome)?.id||null};
  let criadas=0,falhas=0;
  for(const c of antigas){
    if(DB.list('campanhas',k=>k.ownerId===eu.id&&k.nome===(c.nome||'Campanha')).length)continue;
    try{const n=await DB.criarCampanha(c.nome||'Campanha',c.descricao||'',c.cor);
      n.notas=c.notas||'';n.partidas=c.partidas||[];
      n.jogadores=(c.jogadores||[]).map(achar).filter(Boolean);n.rivais=(c.rivais||[]).map(achar).filter(Boolean);
      DB.upsert('campanhas',n);criadas++}catch(e){console.warn(e);falhas++}
  }
  await DB.flush();
  if(!falhas)localStorage.setItem(flag,'1');
  if(criadas)setTimeout(()=>toast(`${plural(criadas,'campanha importada','campanhas importadas')} do navegador.`),900);
}
async function entrar(session){
  const u=session.user;
  DB.data.user={id:u.id,nome:(u.user_metadata&&u.user_metadata.nome)||u.email.split('@')[0]};
  $('#authCampos').hidden=true;$('#authTitulo').textContent='Carregando a instalação…';authMsg('',true);
  let erro=null;
  for(let t=1;t<=4;t++){
    try{await DB.carregar();erro=null;break}
    catch(e){erro=e;console.error(e);if(!/upstream|connect|fetch|network|503|502|timeout/i.test(String(e.message||e)))break;
      authMsg(`O servidor do Supabase não respondeu. Tentando de novo (${t}/3)…`,true);await new Promise(r=>setTimeout(r,2500*t))}
  }
  if(erro){
    const m=String(erro.message||erro);const rede=/upstream|connect|fetch|network|503|502|timeout/i.test(m);
    $('#authTitulo').textContent='Não foi possível carregar os dados';
    authMsg(rede?'O login funcionou, mas o banco de dados do Supabase não está respondendo. Abra o painel do projeto e confira se ele não está pausado ou reiniciando; se precisar, use “Restart project” em Settings → General e tente de novo em alguns minutos.'
      :/does not exist|schema cache|relation/i.test(m)?m+' — confira se os arquivos SQL foram rodados no Supabase.':m);
    $('#authCampos').hidden=false;return}
  try{await importarLocal()}catch(e){console.warn('importação',e);toast('A importação dos dados locais falhou: '+(e.message||e))}
  try{await recuperarCampanhas()}catch(e){console.warn('campanhas',e)}
  await DB.carregarPartida();
  DB.ouvir();
  $('#userName').textContent=DB.data.user.nome;
  document.body.classList.add('logado');
  route();
}
(async function(){
  const tema=localStorage.getItem('bluelock_tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=tema;
  $('#themeBtn').addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('bluelock_tema',n)});
  $('#sairBtn').addEventListener('click',async()=>{await DB.flush();DB.savePartida();await sb.auth.signOut();location.reload()});
  $('#authForm').addEventListener('submit',e=>{e.preventDefault();acaoAuth(false)});
  $('#authCriar').addEventListener('click',()=>acaoAuth(true));
  if(!sb){$('#authTitulo').textContent='Sem conexão';authMsg('Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue.');$('#authCampos').hidden=true;return}
  const {data:{session}}=await sb.auth.getSession();
  if(session)await entrar(session);
})();
</script>
