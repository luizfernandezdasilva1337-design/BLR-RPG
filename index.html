<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Lock RPG — Instalação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --bg:#EDF0FF; --bg2:#E1E6FF; --surface:#FFFFFF; --surface2:#F3F5FF; --ink:#0A1033; --muted:#55609E; --line:#C8CFF3;
  --lock:#1236FF; --lock2:#0A22B8; --on-lock:#FFFFFF; --cyan:#00A9C9; --red:#E3143A; --gold:#C98F00; --green:#0F9A5E;
  --pitch:#0F6B47; --pitch2:#127A51;
  --phy:#F06A00; --sho:#E3143A; --mst:#8A3CF0; --spd:#C99A00; --agi:#0BAA68; --def:#3557D6; --ego:#00A9C9;
  --shadow:0 1px 0 rgba(10,16,51,.06),0 10px 30px -18px rgba(10,16,51,.45);
  --cut:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#050B2E; --bg2:#081142; --surface:#0C1750; --surface2:#11205F; --ink:#E8ECFF; --muted:#8C97D8; --line:#1F2E7C;
  --lock:#2E5BFF; --lock2:#5B80FF; --on-lock:#FFFFFF; --cyan:#3CF0FF; --red:#FF3D5E; --gold:#FFD23F; --green:#2BE38B;
  --phy:#FF8A1F; --sho:#FF3D5E; --mst:#A574FF; --spd:#FFD23F; --agi:#2BE38B; --def:#6E8DFF; --ego:#3CF0FF;
  --shadow:0 0 0 1px rgba(60,240,255,.04),0 14px 40px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 17px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--lock) 22%,transparent) 1.2px,transparent 1.6px) 0 0/9px 9px;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 100% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse 60% 55% at 100% 0%,#000 0%,transparent 70%);opacity:.7}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lock2)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:.95;margin:0;letter-spacing:.01em}
h1{font-size:clamp(44px,7vw,84px);font-weight:900}
h2{font-size:clamp(30px,4vw,44px)}
h3{font-size:24px}
h4{font-size:19px}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;background:var(--lock);color:var(--on-lock);overflow:auto;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 18px)}
.brand{display:block;text-decoration:none;color:inherit;margin:0 6px 18px;position:relative}
.brand b{display:block;font:900 46px/.82 var(--display);letter-spacing:-.01em;transform:skewX(-9deg)}
.brand i{position:absolute;right:4px;bottom:-6px;font:900 italic 19px var(--display);color:var(--lock);background:var(--cyan);padding:0 6px;transform:rotate(-8deg)}
:root[data-theme="dark"] .brand i{color:#050B2E}
.rail nav{display:flex;flex-direction:column;gap:3px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;color:inherit;text-decoration:none;font:700 21px/1 var(--display);letter-spacing:.02em;opacity:.82}
.rail nav a svg{width:20px;height:20px;flex:none}
.rail nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
.rail nav a.on{opacity:1;background:var(--on-lock);color:var(--lock);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rail .foot input{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:3px;padding:6px 8px}
.rail .foot label{opacity:.8}
.main{min-width:0;padding:30px clamp(16px,3.5vw,48px) 120px}
.mobilebar{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;padding:9px 16px;font:700 18px/1 var(--display);letter-spacing:.03em;
  background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:3px;text-decoration:none;white-space:nowrap;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--lock)}
.btn.go{background:var(--lock);color:var(--on-lock);border-color:var(--lock);clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);padding-right:22px}
.btn.go:hover{background:var(--lock2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:16px}
.btn.xs{padding:3px 8px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grow{flex:1}
input.f,select.f,textarea.f{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
textarea.f{resize:vertical;min-height:74px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--lock);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--lock) 22%,transparent)}
label.l{display:block;font-size:14px;color:var(--muted);margin:0 0 4px;font-weight:600}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:600;background:var(--surface2);cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
button.chip.on{background:var(--lock);color:var(--on-lock);border-color:var(--lock)}
.chip.red{border-color:var(--red);color:var(--red)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:15px;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 9px;font:700 15px var(--display);cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--lock);color:var(--on-lock)}
.tec .seg button.on[data-v="0"]{background:var(--surface2);color:var(--muted)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;box-shadow:var(--shadow);position:relative}
.panel>h3,.panel>.spread>h3{margin-bottom:12px}
.tag{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:3px solid var(--ink)}
.pagehead p{margin:8px 0 0;max-width:62ch;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:4px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

/* ---------- jersey card (fichas) ---------- */
.jersey{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:16px 16px 14px;position:relative;cursor:pointer;text-align:left;overflow:hidden}
.jersey:hover{border-color:var(--lock)}
.jersey .no{position:absolute;right:-6px;top:-22px;font:900 128px/1 var(--display);color:var(--lock);opacity:.11;pointer-events:none}
.jersey .who{display:flex;gap:12px;align-items:center;min-width:0}
.jersey .who h3{font-size:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jersey .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--lock);color:var(--on-lock);display:grid;place-items:center;font:900 24px var(--display);overflow:hidden;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--lock)}
.avatar img{width:100%;height:100%;object-fit:cover}
.ovr{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px}
.ovr b{font:900 40px/.9 var(--display)}
.ovr span{font:800 14px var(--display);padding:1px 7px;margin-top:3px;color:#fff;background:var(--rk,var(--lock))}

/* ---------- radar ---------- */
.radar text{font:800 11px var(--display);fill:var(--muted)}
.statbar{height:7px;background:var(--surface2);border-radius:9px;overflow:hidden}
.statbar i{display:block;height:100%;border-radius:9px}

/* ---------- ficha ---------- */
.sheet{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.sheet-hero{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--lock);color:var(--on-lock);padding:22px 26px;position:relative;overflow:hidden;border-radius:4px}
.sheet-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 30px,rgba(255,255,255,.06) 30px 32px);pointer-events:none}
.sheet-hero input{background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.35);color:#fff;width:100%;font:900 clamp(34px,5vw,58px)/1 var(--display);padding:2px 0}
.sheet-hero input:focus{outline:0;border-color:var(--cyan)}
.sheet-hero .sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.sheet-hero .sub input,.sheet-hero .sub select{font:600 16px var(--body);border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:5px 8px;background:rgba(255,255,255,.1);color:#fff;width:auto}
.sheet-hero .sub select option{color:#000}
.bigphoto{width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;overflow:hidden;cursor:pointer;border:3px solid #fff;position:relative;z-index:1;font:900 52px var(--display)}
.bigphoto img{width:100%;height:100%;object-fit:cover}
.bigovr{text-align:center;position:relative;z-index:1}
.bigovr b{display:block;font:900 96px/.8 var(--display);letter-spacing:-.02em}
.bigovr span{display:inline-block;margin-top:6px;font:800 18px var(--display);background:#fff;color:var(--lock);padding:2px 10px}
.stats{display:grid;gap:8px}
.statrow{display:grid;grid-template-columns:118px 70px 1fr 44px auto;gap:10px;align-items:center}
.statrow .nm{font:800 19px var(--display);color:var(--c)}
.statrow .nm small{display:block;font:600 13px var(--body);color:var(--muted)}
.statrow input{width:70px;text-align:center;font:800 22px var(--display);padding:4px}
.statrow .md{font:800 20px var(--display);text-align:center}
.psmeter{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 12px;background:var(--surface2);border-radius:3px;font-weight:600}
.psmeter .statbar{flex:1;height:10px}
.derived{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dv{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surface2)}
.dv span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.dv b{font:900 30px/1 var(--display)}
.fol{grid-column:1/-1}
.folbar{height:22px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.folbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--green),color-mix(in srgb,var(--green) 60%,var(--cyan)));transition:width .25s}
.folbar.low i{background:linear-gradient(90deg,var(--red),var(--gold))}
.folbar em{position:absolute;inset:0;display:grid;place-items:center;font:800 15px var(--display);font-style:normal;color:var(--ink)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:16px;height:16px;transform:rotate(45deg) scale(.8);border:2px solid var(--ego);cursor:pointer}
.pips i.on{background:var(--ego)}
.tecgrid{display:grid;gap:14px}
.tecgroup h4{color:var(--c);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;border-bottom:2px solid var(--c);padding-bottom:3px}
.tecgroup h4 small{font:600 13px var(--body);color:var(--muted)}
.tec{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 0}
.tec .tn{font-weight:600;cursor:help}
.rollbtn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px;cursor:pointer;font:800 16px var(--display);min-width:56px;display:inline-flex;gap:4px;align-items:center;justify-content:center}
.rollbtn:hover{background:var(--lock);color:var(--on-lock);border-color:var(--lock)}
.weapon{border:1px solid var(--line);border-left:5px solid var(--lock);border-radius:3px;padding:12px 14px;background:var(--surface2);margin-bottom:10px}
.weapon h4{font-size:22px}
.weapon dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0;font-size:15px}
.weapon dt{color:var(--muted);font-weight:700}
.weapon dd{margin:0}

/* ---------- estilos (trading cards) ---------- */
.stylegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.scard{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;position:relative}
.scard:hover .art{filter:saturate(1.25)}
.scard:hover{border-color:var(--sc)}
.art{position:relative;aspect-ratio:4/4.3;background:var(--sc);overflow:hidden;color:#fff;transition:filter .2s}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .tone{position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(0,0,0,.35) 1.3px,transparent 1.8px) 0 0/7px 7px;mix-blend-mode:multiply;opacity:.55}
.art .lines{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 70% 35%,rgba(255,255,255,.18) 0 2deg,transparent 2deg 9deg)}
.art .rd{position:absolute;right:-18px;bottom:-22px;width:72%;opacity:.95}
.art .ini{position:absolute;left:14px;top:8px;font:900 92px/1 var(--display);letter-spacing:-.04em;opacity:.95;text-shadow:3px 3px 0 rgba(0,0,0,.25)}
.art .ov{position:absolute;left:14px;bottom:12px;font:900 15px var(--display);background:#fff;color:#000;padding:2px 8px}
.scard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.scard h3{font-size:25px}
.scard .flag{position:absolute;top:10px;right:10px;z-index:2}
.ghostcard{border:2px dashed var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;min-height:140px;color:var(--muted);background:transparent;cursor:pointer;text-align:left}
.ghostcard b{font:800 22px var(--display);color:var(--ink);opacity:.6}
.ghostcard:hover{border-color:var(--lock)}

/* ---------- biblioteca ---------- */
.libitem{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);border-top:4px solid var(--kc,var(--lock))}
.libitem h3{font-size:24px}
.costpill{font:800 16px var(--display);background:var(--ink);color:var(--bg);padding:2px 9px;border-radius:2px}
.efftable{width:100%;border-collapse:collapse;font-size:15px}
.efftable th,.efftable td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.efftable th{font:800 15px var(--display);color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pickopt{border:1px solid var(--line);border-radius:3px;padding:9px 11px;cursor:pointer;background:var(--surface2);text-align:left}
.pickopt.on{border-color:var(--lock);background:color-mix(in srgb,var(--lock) 14%,var(--surface2));box-shadow:inset 0 0 0 1px var(--lock)}
.pickopt b{display:flex;justify-content:space-between;font:800 17px var(--display)}
.pickopt small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:3px}

/* ---------- campanhas ---------- */
.campgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.camp{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.camp .band{height:62px;background:var(--cc);position:relative;overflow:hidden}
.camp .band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 3px,transparent 3px 14px)}
.camp .band span{position:absolute;right:10px;bottom:6px;font:800 14px var(--display);color:#fff;background:rgba(0,0,0,.3);padding:1px 7px;z-index:1}
.camp .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.camp h3{font-size:24px}
.camp .cb p{font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.camp .cb .btn{margin-top:auto;align-self:flex-start}
.chead{border-radius:4px;background:var(--cc);color:#fff;padding:24px 26px;position:relative;overflow:hidden;margin-bottom:18px}
.chead::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.1) 0 3px,transparent 3px 16px);pointer-events:none}
.chead>*{position:relative;z-index:1}
.chead .btn{background:#fff;color:#000;border-color:#fff}
.chead .btn.go{background:#000;color:#fff;border-color:#000}
.mini{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface2)}
.mini .avatar{width:38px;height:38px;font-size:18px}
.mini b{font:800 19px var(--display)}
.list{display:grid;gap:8px}

/* ---------- escudo ---------- */
.shield{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.scrd{background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;gap:8px;box-shadow:var(--shadow)}
.scrd .top{display:flex;gap:10px;align-items:center}
.scrd .top b{font:800 22px var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kv div{background:var(--surface2);border-radius:3px;padding:4px 2px}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font:800 20px var(--display)}

/* ---------- partida ---------- */
.match{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:14px;align-items:start}
.scoreboard{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--ink);color:var(--bg);border-radius:4px;overflow:hidden}
.scoreboard .tm{display:flex;align-items:center;gap:14px;padding:10px 18px;font:900 28px var(--display);min-width:0}
.scoreboard .tm.b{justify-content:flex-end;text-align:right}
.scoreboard .tm .sw{width:14px;align-self:stretch;flex:none}
.scoreboard .tm input{background:transparent;border:0;color:inherit;font:inherit;width:100%;min-width:0}
.scoreboard .tm.b input{text-align:right}
.scoreboard .sc{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--lock);color:#fff}
.scoreboard .sc b{font:900 54px/1 var(--display);min-width:44px;text-align:center}
.scoreboard .sc .mid{text-align:center;font:800 15px/1.1 var(--display);opacity:.9}
.goalbtn{border:0;background:rgba(255,255,255,.15);color:#fff;width:24px;height:24px;border-radius:3px;cursor:pointer;font:800 16px var(--display)}
.tools{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<script>
"use strict";
/* =========================================================
   REGRAS DO SISTEMA (extraídas do livro Blue Lock RPG)
   ========================================================= */
const STATS=[
 {k:'phy',s:'PHY',n:'Físico',d:'Potência muscular, resistência e equilíbrio. Confrontos corporais.'},
 {k:'sho',s:'SHO',n:'Chute',d:'Precisão, alcance e calibração do chute. Voleios, curvas, faltas e longa distância.'},
 {k:'mst',s:'MST',n:'Maestria',d:'Coordenação e controle de bola. Essencial para meias e dribladores.'},
 {k:'spd',s:'SPD',n:'Velocidade',d:'Ritmo de corrida, largada, furar linhas e contra-ataque. Define o deslocamento por turno.'},
 {k:'agi',s:'AGI',n:'Agilidade',d:'Raciocínio, reação e iniciativa. Fintas sem bola para fugir da marcação.'},
 {k:'def',s:'DEF',n:'Defesa',d:'Posicionamento, desarme, prever ataques, reagir a dribles e interceptar passes.'},
 {k:'ego',s:'EGO',n:'Ego',d:'Resiliência mental, individualismo e fome de vitória. Define o Dado de Ego e o Flow.'}
];
const TECNICAS={
 phy:['Corpo a Corpo','Roubo de Bola','Cabeceio'],
 sho:['Voleio','Chute Colocado','Chute de Longa Distância','Chute Acrobático'],
 mst:['Domínio','Passe por Cima','Passe Rasteiro','Drible'],
 spd:['Aceleração','Adiantamento','Recomposição'],
 agi:['Desmarcação','Finta de Corpo','Rebote'],
 def:['Desarme','Interceptação','Bloqueio'],
 ego:['Intimidação','Visão de Jogo','Resiliência']
};
const TEC_DESC={
 'Corpo a Corpo':'Usado em confrontos usando o próprio corpo.',
 'Roubo de Bola':'Roubar a bola com risco de falta, contra Drible ou Corpo a Corpo.',
 'Cabeceio':'Roubar ou defender bolas aéreas vindas de Passe por Cima.',
 'Voleio':'Finalizar sem dominar a bola antes, ignorando penalidades.',
 'Chute Colocado':'Finalizações com chute curvado, dificultando a defesa.',
 'Chute de Longa Distância':'Finalizar de longe, quase anulando a desvantagem.',
 'Chute Acrobático':'Finalizações difíceis, como bicicleta e situações desfavoráveis.',

 'Passe por Cima':'“Sky-pass”, passando cavado por cima dos defensores.',

 'Aceleração':'Bônus de deslocamento por turno.',
 'Adiantamento':'Teste oposto contra Adiantamento para penetrar a defesa.',
 'Recomposição':'Reação para deslocar até a defesa em contra-ataques.',
 'Desmarcação':'Sem a bola: livra-se da marcação e fica livre para ações.',
 'Finta de Corpo':'Fintas que aplicam “Desequilibrado”, com risco enorme.',
 'Rebote':'Recuperar bolas rebatidas por goleiros.',
 'Desarme':'Desarmar atacantes com segurança, sem risco de falta.',

 'Bloqueio':'Contra chutes, defendendo a bola. Também usado por goleiros.',

};
const TEC_STAT={};Object.entries(TECNICAS).forEach(([k,a])=>a.forEach(t=>TEC_STAT[t]=k));
const ALL_TEC=Object.values(TECNICAS).flat();
const CHUTES=TECNICAS.sho;
const NIVEIS=[{n:'Sem treino',s:'—',b:0,pt:0},{n:'Treinado',s:'T',b:2,pt:15},{n:'Especializado',s:'E',b:4,pt:30},{n:'Mestre',s:'M',b:6,pt:50}];
const RANKS=[
 {min:101,r:'S+',n:'Profissional/Master',c:'#C9A100'},
 {min:90,r:'S',n:'Gênio/Mundial',c:'#E0A800'},
 {min:80,r:'A',n:'NEL Egoísta',c:'#E3143A'},
 {min:70,r:'B',n:'Promissor/Bom',c:'#8A3CF0'},
 {min:60,r:'C',n:'Mediano',c:'#0B9A68'},
 {min:50,r:'D',n:'Abaixo da Média',c:'#3557D6'},
 {min:0,r:'F',n:'Extremo Iniciante',c:'#6A7299'}
];
const GATILHOS=[
 {k:'livre',n:'Livre',d:'Pode ser usado a qualquer momento do seu turno.',c:5},
 {k:'movimento',n:'Movimento',d:'Pode ser usado após correr ou driblar.',c:0},
 {k:'reacao',n:'Reação',d:'Ocorre fora do seu turno.',c:-5},
 {k:'extremo',n:'Extremo',d:'Situações complexas, como dentro da área ou contra 2 marcadores.',c:-10}
];
const EFEITOS=[
 {k:'acel_bruta',g:'Potência',n:'Aceleração Bruta',d:'Adiciona o modificador de outro Status ao invés de usar uma Técnica.',c:15,pe:1},
 {k:'tec_apurada',g:'Potência',n:'Técnica Apurada',d:'Bônus fixo de +3 em uma Técnica específica.',c:10,bonus:3},
 {k:'foco',g:'Potência',n:'Foco Absoluto',d:'Bônus fixo de +5 em uma Técnica específica.',c:20,pe:1,bonus:5},
 {k:'determinacao',g:'Potência',n:'Determinação',d:'+1 Dado de Ego gratuito na jogada.',c:10,egoFree:1},
 {k:'amortecer',g:'Controle',n:'Amortecer',d:'Você domina a bola completamente.',c:10},
 {k:'bloq_espacial',g:'Controle',n:'Bloqueio Espacial',d:'Sua Zona de Pressão aumenta em +1 quadrado.',c:10},
 {k:'arrancada',g:'Controle',n:'Arrancada',d:'Você dobra a distância de movimento.',c:15},
 {k:'sombra',g:'Controle',n:'Sombra',d:'Você se move junto ao alvo marcado como Reação.',c:15},
 {k:'desgastar',g:'Supressão',n:'Desgastar',d:'O oponente gasta o dobro de Fôlego para executar Reações no turno.',c:10},
 {k:'driblar_barreira',g:'Supressão',n:'Driblar Barreira',d:'Inibe a Técnica de Bloqueio/Desarme de 1 oponente adjacente.',c:15,pe:1},
 {k:'intimidar',g:'Supressão',n:'Intimidar',d:'Intimida um oponente defensor, aplicando −3 em seus testes.',c:20,pe:1}
];
const GRUPO_COR={'Potência':'var(--red)','Controle':'var(--lock)','Supressão':'var(--gold)'};
const CONDICOES=['Intimidado','Desequilibrado','Cansado','Marcado','Livre de marcação','Flow','Lesionado'];
const POSICOES=['Atacante','Ponta','Meia','Volante','Zagueiro','Lateral','Goleiro'];
const FUNCOES=['Finalizador','Físico','Velocista','Criador','Defensor','Goleiro','Coringa'];
const PT_GANHOS={vitoria:10,empate:5,derrota:2,gol:5,assist:3,mvp:5,bloqueio:3};
const CRIACAO={ps:280,max:55,treinadas:3};

/* ---------- cálculos ---------- */
const mod=v=>Math.floor((+v||0)/10);
const sumStats=st=>STATS.reduce((s,x)=>s+(+st?.[x.k]||0),0);
const overall=st=>Math.floor(sumStats(st)/7);
const rankOf=o=>RANKS.find(r=>o>=r.min)||RANKS[RANKS.length-1];
const ptStat=v=>v<40?5:v<60?10:v<80?15:25;
function derived(f){
  const st=f.status||{};const o=overall(st);
  return {o,rank:rankOf(o),folMax:50+(+st.phy||0),ini:10+mod(st.agi),peMax:Math.floor((+st.ego||0)/5),
    zona:(+st.def||0)>=90?3:(+st.def||0)>=60?2:1,egoDie:(+st.ego||0)>=90?10:(+st.ego||0)>=60?8:4,
    efeitos:o>=80?3:o>=60?2:1};
}
const tecLvl=(f,t)=>+(f.tecnicas?.[t]||0);
const tecBonus=(f,t)=>NIVEIS[tecLvl(f,t)].b;
function efeito(k){
  const b=EFEITOS.find(e=>e.k===k);if(b)return b;
  if(typeof k==='string'&&k.startsWith('c:')){const p=DB.get('biblioteca',k.slice(2));if(p)return {k,g:p.grupo||'Potência',n:p.nome,d:p.descricao||'',c:+p.custoFolego||0,pe:p.custoPE?1:0,custom:1};}
  return null;
}
function todosEfeitos(){return EFEITOS.concat(DB.list('biblioteca',x=>x.tipo==='Propriedade'&&(x.publicado||DB.mine(x))).map(p=>efeito('c:'+p.id)).filter(Boolean))}
function custoCalc(a){
  const g=GATILHOS.find(x=>x.k===a.gatilhoTipo);
  return Math.max(0,(g?g.c:0)+(a.efeitos||[]).reduce((s,k)=>s+(efeito(k)?.c||0),0));
}
const d=n=>1+Math.floor(Math.random()*n);

/* =========================================================
   ARMAZENAMENTO — Supabase com cache em memória.
   O resto do site só usa DB.list / get / upsert / remove.
   ========================================================= */
const SUPABASE_URL='https://vppxjvlkztaatoatntzk.supabase.co';
const SUPABASE_KEY='sb_publishable_WYxXcHBTnJpZ-8_trNQDTA_O0nU1asJ';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bluelock-rpg-auth'}}):null;
const semCampos=(o,ks)=>{const c={...o};ks.forEach(k=>delete c[k]);return c};

const msDe=s=>Date.parse(s)||0;
const BASE_OMIT=['id','autorId','autorNome','nome','criadoEm','atualizadoEm'];
const ROW={
 fichas:{
  to:o=>({id:o.id,tipo:o.tipo,nome:o.nome||'',dados:semCampos(o,[...BASE_OMIT,'tipo']),atualizado_em:isoDe(o)}),
  from:r=>({...(r.dados||{}),id:r.id,tipo:r.tipo,nome:r.nome,autorId:r.user_id,atualizadoEm:msDe(r.atualizado_em)})},
 estilos:{

  from:r=>({...(r.dados||{}),id:r.id,nome:r.nome,funcao:r.funcao,oficial:!!r.oficial,publicado:!!r.publicado,autorId:r.autor_id,autorNome:r.autor_nome,atualizadoEm:msDe(r.atualizado_em)})},
 biblioteca:{
  to:o=>({id:o.id,autor_nome:o.autorNome||DB.data.user.nome,tipo:o.tipo,nome:o.nome||'',publicado:!!o.publicado,dados:semCampos(o,[...BASE_OMIT,'tipo','oficial','publicado']),atualizado_em:isoDe(o)}),
  from:r=>({...(r.dados||{}),id:r.id,tipo:r.tipo,nome:r.nome,oficial:!!r.oficial,publicado:!!r.publicado,autorId:r.autor_id,autorNome:r.autor_nome,atualizadoEm:msDe(r.atualizado_em)})},
 campanhas:{

  from:r=>({id:r.id,nome:r.nome,descricao:r.descricao||'',cor:r.cor||'#1236FF',codigo:r.codigo,notas:r.notas||'',partidas:r.partidas||[],ownerId:r.owner_id,autorId:r.owner_id,jogadores:[],rivais:[],atualizadoEm:msDe(r.atualizado_em)})}
};
let _ultimoErro=0;
function erroNuvem(e){console.error(e);if(Date.now()-_ultimoErro>4000){_ultimoErro=Date.now();toast('Não foi possível salvar na nuvem: '+(e.message||e))}}
function statusSync(){const el=document.getElementById('syncInfo');if(!el)return;const n=Object.keys(DB.timers).length+Object.keys(DB.inflight).length;el.textContent=n?'Salvando…':'Sincronizado'}
const DB={
  data:{user:null,fichas:[],estilos:[],biblioteca:[],campanhas:[],rolagens:[],partida:null},
  remote:new Set(),links:{},timers:{},inflight:{},own:{},
  list(col,pred){const a=this.data[col]||[];return pred?a.filter(pred):a.slice()},
  get(col,id){return (this.data[col]||[]).find(x=>x.id===id)||null},
  mine(o){return !!o&&!!this.data.user&&o.autorId===this.data.user.id},
  upsert(col,obj){
    obj.atualizadoEm=Date.now();
    if(!obj.id)obj.id=uid();
    if(!obj.criadoEm)obj.criadoEm=obj.atualizadoEm;
    if(!obj.autorId){obj.autorId=this.data.user.id;obj.autorNome=this.data.user.nome;}
    const a=this.data[col];const i=a.findIndex(x=>x.id===obj.id);
    if(i<0)a.push(obj);else a[i]=obj;
    if(ROW[col])this.queue(col,obj.id);
    return obj;
  },
  queue(col,id,ms=450){const k=col+':'+id;clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>{delete this.timers[k];this.push(col,id)},ms);statusSync()},
  async push(col,id){
    const k=col+':'+id;
    while(this.inflight[k])await this.inflight[k];
    const o=this.get(col,id);if(!o)return;
    const row=ROW[col].to(o);this.own[id]=msDe(row.atualizado_em);
    const run=(async()=>{
      let r;
      if(this.remote.has(k))r=await sb.from(col).update(row).eq('id',id);
      else{r=await sb.from(col).insert(row);
        if(!r.error)this.remote.add(k);
        else if(r.error.code==='23505'){this.remote.add(k);r=await sb.from(col).update(row).eq('id',id)}}
      if(r.error)erroNuvem(r.error);
      else if(col==='campanhas')await this.syncLinks(o);
    })();
    this.inflight[k]=run;statusSync();
    try{await run}finally{if(this.inflight[k]===run)delete this.inflight[k];statusSync()}
  },
  async flush(){
    const ks=Object.keys(this.timers);ks.forEach(k=>clearTimeout(this.timers[k]));this.timers={};
    await Promise.all(ks.map(k=>{const i=k.indexOf(':');return this.push(k.slice(0,i),k.slice(i+1))}));
    await Promise.all(Object.values(this.inflight));statusSync();
  },
  remove(col,id){
    const k=col+':'+id;clearTimeout(this.timers[k]);delete this.timers[k];
    this.data[col]=this.data[col].filter(x=>x.id!==id);
    if(this.remote.has(k)){this.remote.delete(k);sb.from(col).delete().eq('id',id).then(({error})=>{if(error)erroNuvem(error)})}
    statusSync();
  },
  async syncLinks(c){
    const cur=this.links[c.id]||{};const want={};
    (c.jogadores||[]).forEach(i=>want[i]='jogadores');(c.rivais||[]).forEach(i=>want[i]='rivais');
    const del=Object.keys(cur).filter(i=>want[i]!==cur[i]);
    const add=Object.keys(want).filter(i=>cur[i]!==want[i]);
    for(const i of del){const r=await sb.from('campanha_fichas').delete().eq('campanha_id',c.id).eq('ficha_id',i);if(r.error)return erroNuvem(r.error);delete cur[i]}
    for(const i of add){
      if(this.timers['fichas:'+i]||!this.remote.has('fichas:'+i)){clearTimeout(this.timers['fichas:'+i]);delete this.timers['fichas:'+i];await this.push('fichas',i)}
      const r=await sb.from('campanha_fichas').insert({campanha_id:c.id,ficha_id:i,papel:want[i]});
      if(r.error&&r.error.code!=='23505')return erroNuvem(r.error);cur[i]=want[i];
    }
    this.links[c.id]=cur;
  },
  async criarCampanha(nome,descricao,cor){
    const r=await sb.rpc('criar_campanha',{p_nome:nome,p_descricao:descricao||'',p_cor:cor||'#1236FF'});
    if(r.error)throw r.error;
    const row=Array.isArray(r.data)?r.data[0]:r.data;const c=ROW.campanhas.from(row);
    this.data.campanhas.push(c);this.remote.add('campanhas:'+c.id);this.links[c.id]={};return c;
  },
  async carregar(){
    const q=t=>sb.from(t).select('*');
    const [f,e,b,c,l,r]=await Promise.all([q('fichas'),q('estilos'),q('biblioteca'),q('campanhas'),q('campanha_fichas'),
      sb.from('rolagens').select('*').order('criado_em',{ascending:false}).limit(100)]);
    const ruim=[f,e,b,c,l].find(x=>x.error);if(ruim)throw ruim.error;
    const pend=k=>this.timers[k]||this.inflight[k];
    const mesclar=(col,rows)=>{const novos=rows.map(ROW[col].from);rows.forEach(x=>this.remote.add(col+':'+x.id));
      this.data[col].forEach(o=>{if(pend(col+':'+o.id)&&!novos.some(n=>n.id===o.id))novos.push(o)});
      this.data[col]=novos.map(n=>pend(col+':'+n.id)?(this.get(col,n.id)||n):n);};
    mesclar('fichas',f.data);mesclar('estilos',e.data);mesclar('biblioteca',b.data);
    const camps=c.data.map(ROW.campanhas.from);c.data.forEach(x=>this.remote.add('campanhas:'+x.id));
    this.links={};
    l.data.forEach(x=>{(this.links[x.campanha_id]||(this.links[x.campanha_id]={}))[x.ficha_id]=x.papel;const cc=camps.find(k=>k.id===x.campanha_id);if(cc)cc[x.papel].push(x.ficha_id)});
    this.data.campanhas=camps;
    if(!r.error)this.data.rolagens=(r.data||[]).map(x=>({...x.dados,id:x.id}));
  },
  rolagem(r){
    this.data.rolagens.unshift(r);this.data.rolagens=this.data.rolagens.slice(0,100);
    const camp=r.fichaId?this.list('campanhas').find(c=>[...(c.jogadores||[]),...(c.rivais||[])].includes(r.fichaId)):null;
    const ok=r.fichaId&&this.remote.has('fichas:'+r.fichaId);
    sb.from('rolagens').insert({id:r.id,ficha_id:ok?r.fichaId:null,campanha_id:camp?camp.id:null,dados:r}).then(({error})=>{if(error)console.warn('rolagem',error)});
  },
  // partida ativa: localStorage + tabela "partidas" quando ligada a uma campanha
  _ps:null,_pr:null,_lastCamp:null,
  save(){this.savePartida()},
  saveSoon(){clearTimeout(this._ps);this._ps=setTimeout(()=>this.savePartida(),300)},
  savePartida(){
    if(!this.data.user)return;const M=this.data.partida;const k='bluelock_partida_'+this.data.user.id;
    try{M?localStorage.setItem(k,JSON.stringify(M)):localStorage.removeItem(k)}catch(_){}
    clearTimeout(this._pr);
    this._pr=setTimeout(async()=>{
      try{
        if(M&&M.campanhaId){await sb.from('partidas').upsert({campanha_id:M.campanhaId,estado:M,atualizado_em:new Date().toISOString()},{onConflict:'campanha_id'})}
        if((!M||M.campanhaId!==this._lastCamp)&&this._lastCamp){await sb.from('partidas').delete().eq('campanha_id',this._lastCamp)}
        this._lastCamp=M?M.campanhaId||null:null;
      }catch(e){console.warn(e)}
    },1200);
  },
  async carregarPartida(){
    const k='bluelock_partida_'+this.data.user.id;
    try{this.data.partida=JSON.parse(localStorage.getItem(k)||'null')}catch(_){this.data.partida=null}
    if(!this.data.partida){const r=await sb.from('partidas').select('estado,campanha_id').eq('owner_id',this.data.user.id).limit(1);if(!r.error&&r.data?.[0])this.data.partida=r.data[0].estado}
    this._lastCamp=this.data.partida?.campanhaId||null;
  },
  // tempo real
  ch:null,
  ouvir(){
    if(this.ch)sb.removeChannel(this.ch);
    this.ch=sb.channel('bluelock-'+this.data.user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'fichas'},p=>this.fichaRemota(p))
      .on('postgres_changes',{event:'*',schema:'public',table:'campanha_fichas'},()=>{clearTimeout(this._rl);this._rl=setTimeout(()=>this.carregar().then(agendarRender).catch(console.warn),400)})
      .on('postgres_changes',{event:'*',schema:'public',table:'campanhas'},p=>{const id=(p.new&&p.new.id)||(p.old&&p.old.id);if(id&&(this.timers['campanhas:'+id]||this.inflight['campanhas:'+id]))return;if(p.new&&this.own[id]===msDe(p.new.atualizado_em))return;clearTimeout(this._rl);this._rl=setTimeout(()=>this.carregar().then(agendarRender).catch(console.warn),400)})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'rolagens'},p=>{const x=p.new;if(!x||this.data.rolagens.some(r=>r.id===x.id))return;this.data.rolagens.unshift({...x.dados,id:x.id});if($('#view').dataset.route==='campanha')agendarRender()})
      .subscribe();
  },
  fichaRemota(p){
    if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(!id)return;this.data.fichas=this.data.fichas.filter(x=>x.id!==id);this.remote.delete('fichas:'+id);agendarRender();return}
    const r=p.new;if(!r)return;const t=msDe(r.atualizado_em);
    if(this.own[r.id]===t)return;
    if(this.timers['fichas:'+r.id]||this.inflight['fichas:'+r.id])return;
    const loc=this.get('fichas',r.id);if(loc&&loc.atualizadoEm>t)return;
    const f=ROW.fichas.from(r);this.remote.add('fichas:'+r.id);
    const a=this.data.fichas;const i=a.findIndex(x=>x.id===r.id);if(i<0)a.push(f);else a[i]=f;
    if(typeof syncPartida==='function')syncPartida(f);
    agendarRender();
  }
};

/* ---------- utilidades ---------- */
function uid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function getPath(o,p){return p.split('.').reduce((a,k)=>a?.[k],o)}

function lerImagem(file,max=480){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ---------- radar heptagonal ---------- */
function radar(st,{size=200,color='var(--lock)',labels=true,max=100,stroke='currentColor',bg=true}={}){
  const c=size/2,R=size/2-(labels?24:6),n=7;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*r,c+Math.sin(a)*r]};
  const ring=k=>STATS.map((_,i)=>pt(i,R*k).join(',')).join(' ');
  const poly=STATS.map((s,i)=>pt(i,R*clamp((+st?.[s.k]||0)/max,0,1)).map(v=>v.toFixed(1)).join(',')).join(' ');
  let g='';
  if(bg){[.25,.5,.75,1].forEach(k=>g+=`<polygon points="${ring(k)}" fill="none" stroke="${stroke}" stroke-opacity=".18"/>`);
    STATS.forEach((_,i)=>{const p=pt(i,R);g+=`<line x1="${c}" y1="${c}" x2="${p[0]}" y2="${p[1]}" stroke="${stroke}" stroke-opacity=".14"/>`});}
  g+=`<polygon points="${poly}" fill="${color}" fill-opacity=".35" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(labels)STATS.forEach((s,i)=>{const p=pt(i,R+14);g+=`<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle">${s.s}</text>`});
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="100%" role="img" aria-label="Gráfico dos 7 status">${g}</svg>`;
}

/* ---------- dados / bandeja de rolagem ---------- */
function rolar({nome,status,tecnicas,tec,extra=0,ego=false,egoDie=4,penal=0,overall:ov=0,fichaId=null,fonte=''}){
  const a=d(20),b=d(20),best=Math.max(a,b);
  const sk=TEC_STAT[tec]||tec;const m=mod(status?.[sk]);
  const tb=NIVEIS[+(tecnicas?.[tec]||0)].b;
  const eg=ego?d(egoDie):0;
  const total=best+m+tb+(+extra||0)+eg-(+penal||0);
  const r={id:uid(),t:Date.now(),nome,tec,dados:[a,b],best,mod:m,tb,extra:+extra||0,eg,egoDie:ego?egoDie:0,penal:+penal||0,total,ov,fichaId,fonte,crit:best===20};
  DB.rolagem(r);
  return r;
}
function linhasRolagem(r){
  const L=[[`2d20 (melhor)`,r.best],[`Mod. ${STATS.find(s=>s.k===TEC_STAT[r.tec])?.s||''}`,'+'+r.mod]];
  if(r.tb)L.push([NIVEIS.find(n=>n.b===r.tb)?.n||'Técnica','+'+r.tb]);
  if(r.extra)L.push(['Bônus',(r.extra>0?'+':'')+r.extra]);
  if(r.eg)L.push([`Dado de Ego (d${r.egoDie})`,'+'+r.eg]);
  if(r.penal)L.push(['Penalidade','−'+r.penal]);
  return L.map(([a,b])=>`<span>${esc(a)}</span><b>${esc(b)}</b>`).join('');
}
function diceHtml(r){return `<span class="dice">${r.dados.map((v,i)=>`<i class="${i===r.dados.indexOf(r.best)?(r.crit?'best crit':'best'):''}">${v}</i>`).join('')}</span>`}
function mostrarTray(r){
  const t=$('#tray');
  t.innerHTML=`<div class="tt"><span>${esc(r.nome)} — ${esc(r.tec)}</span><button class="x" aria-label="Fechar" data-act="trayClose">×</button></div>
   <div class="spread" style="margin:6px 0"><span class="tot">${r.total}</span>${diceHtml(r)}</div>
   <div class="result" style="padding:0;background:none;animation:none"><div class="lines2 br">${linhasRolagem(r)}</div></div>
   ${r.crit?'<div style="color:var(--cyan);font-weight:700;margin-top:6px">20 natural!</div>':''}`;
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
  clearTimeout(mostrarTray._t);mostrarTray._t=setTimeout(()=>t.classList.remove('show'),9000);
}

function tabelaEfeitos(){
  return `<table class="efftable"><thead><tr><th>Efeito</th><th>Grupo</th><th>O que faz</th><th>Custo</th></tr></thead><tbody>${EFEITOS.map(e=>`<tr><td><b>${e.n}</b></td><td style="color:${GRUPO_COR[e.g]}">${e.g}</td><td>${e.d}</td><td class="num">+${e.c}${e.pe?' ou 1 PE':''}</td></tr>`).join('')}</tbody></table>`;
}
function tabelaGatilhos(){return `<table class="efftable"><thead><tr><th>Gatilho</th><th>Quando</th><th>Custo</th></tr></thead><tbody>${GATILHOS.map(g=>`<tr><td><b>${g.n}</b></td><td>${g.d}</td><td class="num">${g.c>0?'+':''}${g.c||'Neutro'}</td></tr>`).join('')}</tbody></table>`}
function regrasHtml(){
  return `
  <details class="rule" open><summary>Overall e ranque</summary><div><p>Overall é a média dos 7 status, arredondada para baixo. Define o desempate, a hierarquia no time e a <b>Intimidação Passiva</b>: com 20 ou mais de diferença, o de menor Overall fica Intimidado sem que o outro gaste ações.</p>${RANKS.map(r=>`<span class="chip" style="margin:2px;border-color:${r.c}">${r.r} · ${r.n} (${r.min}+)</span>`).join('')}</div></details>
  <details class="rule"><summary>Status e técnicas</summary><div>${STATS.map(s=>`<p><b style="color:var(--${s.k})">${s.n} (${s.s})</b> — ${s.d}<br><span class="small muted">${TECNICAS[s.k].join(', ')}</span></p>`).join('')}<p>Técnica Treinada +2 (15 PT), Especializada +4 (30 PT), Mestre +6 (50 PT).</p></div></details>
  <details class="rule"><summary>Economia de ações</summary><div><p><b>2 Ações Livres</b> (falar, gesticular, usar armas, Meta-Visão, provocar). <b>1 Deslocamento</b> por turno. <b>1 Ação Principal</b> por turno (chute, passe, desarme…). <b>1 Reação</b> por rodada, mesmo fora do seu turno.</p></div></details>
  <details class="rule"><summary>Status derivados</summary><div><p><b>Fôlego</b> = 50 + Físico. <b>Iniciativa</b> = 10 + Mod. de Agilidade (empate: maior Overall). <b>Pontos de Ego</b> = Ego ÷ 5. <b>Zona de Pressão</b>: Defesa até 59 = 1 quadrado, 60–89 = 2, 90+ = 3.</p></div></details>
  <details class="rule"><summary>Criação de atacante</summary><div><p>Escolha o tipo de atacante, distribua <b>280 PS</b> (máximo 55 em cada status), escolha até <b>3 técnicas Treinadas</b> e decida o que rege seu Ego e sua Arma principal.</p></div></details>
  <details class="rule"><summary>Armas: gatilhos e efeitos</summary><div>${tabelaGatilhos()}<br>${tabelaEfeitos()}<p class="small muted" style="margin-top:8px">Overall 40–59: 1 efeito por arma. 60–79: 2 efeitos. 80–99: 3 efeitos. Um novo efeito custa em PT o mesmo valor de Fôlego da propriedade.</p></div></details>
  <details class="rule"><summary>Evolução e PT</summary><div><p>Status 0–39: 5 PT por ponto · 40–59: 10 · 60–79: 15 · 80–99: 25.</p><p>Partida: vitória 10, empate 5, derrota 2, gol 5, assistência 3, MVP 5, bloqueio crucial 3.</p><p>Treino padrão +5 PT (−5 Fôlego inicial na próxima partida). Treino intensivo +10 PT (−15). Descanso recupera 10 do cansaço acumulado.</p></div></details>`;
}
ROUTES.regras=()=>`<div class="pagehead"><div><h1>Regras rápidas</h1><p>O essencial do livro para consultar durante a sessão.</p></div></div><div class="panel">${regrasHtml()}</div>`;

function cardFicha(f){
  const dv=derived(f);const e=f.estiloId?DB.get('estilos',f.estiloId):null;
  return `<button class="jersey tag" data-act="abrir" data-href="#/${f.tipo==='npc'?'rival':'ficha'}/${f.id}">
    <span class="no">${esc(f.numero||'')}</span>
    <div class="who">${avatar(f)}<div style="min-width:0"><h3>${esc(f.nome)}</h3><div class="small muted">${esc(f.posicao||'')}${f.time?' · '+esc(f.time):''}</div></div></div>
    <div class="ovr" style="--rk:${dv.rank.c}"><b>${dv.o}</b><span>${dv.rank.r}</span></div>
    <div class="meta">${e?`<span class="chip" style="border-color:${e.cor}">${esc(e.nome)}</span>`:''}<span class="chip">Fôlego ${fol(f)}/${dv.folMax}</span>${f.tipo==='jogador'?`<span class="chip gold">${f.pt||0} PT</span>`:''}${(f.condicoes||[]).map(c=>`<span class="chip red">${esc(c)}</span>`).join('')}</div>
  </button>`;
}
function listaFichas(tipo){
  const npc=tipo==='npc';
  const q=(listaFichas.q||'').toLowerCase();
  const all=DB.list('fichas',f=>f.tipo===tipo&&DB.mine(f));
  const fs=all.filter(f=>!q||(f.nome+' '+f.posicao+' '+(f.time||'')).toLowerCase().includes(q)).sort((a,b)=>overall(b.status)-overall(a.status));
  return `<div class="pagehead"><div><h1>${npc?'Rivais':'Jogadores'}</h1><p>${npc?'Fichas de NPCs para o Mestre: rivais, goleiros e times adversários. Gere um rival em segundos a partir de um estilo de jogo.':'As fichas dos atacantes da mesa. Comece do zero com 280 PS ou parta de um estilo de jogo pronto.'}</p></div>
   <div class="row">${npc?`<button class="btn" data-act="rivalDeEstilo">Gerar de um estilo</button>`:''}<button class="btn go" data-act="novaFicha" data-tipo="${tipo}">${npc?'Novo rival':'Novo jogador'}</button></div></div>
   ${all.length>3?`<div class="field" style="max-width:360px"><input class="f" placeholder="Buscar por nome, posição ou time" value="${esc(listaFichas.q||'')}" data-act-input="buscaFichas"></div>`:''}
   ${fs.length?`<div class="cards">${fs.map(cardFicha).join('')}</div>`:all.length?`<p class="muted">Nada encontrado para essa busca.</p>`:
   `<div class="empty"><h3>${npc?'Nenhum rival cadastrado':'Nenhum jogador ainda'}</h3><p>${npc?'Crie um rival do zero ou gere um a partir de um estilo de jogo.':'Crie sua primeira ficha para entrar no Blue Lock.'}</p><button class="btn go" data-act="novaFicha" data-tipo="${tipo}">${npc?'Novo rival':'Criar jogador'}</button></div>`}`;
}
ROUTES.jogadores=()=>listaFichas('jogador');
ROUTES.rivais=()=>listaFichas('npc');

function fichaAtual(){const el=$('[data-ficha]');return el?DB.get('fichas',el.dataset.ficha):null}
function atualizarDerivados(f){
  const dv=derived(f);const set=(k,v)=>{const el=$(`[data-d="${k}"]`);if(el)el.textContent=v};
  set('o',dv.o);set('rank','Ranque '+dv.rank.r);set('rankn',dv.rank.n);set('ini',dv.ini);set('zona',dv.zona);set('egodie','d'+dv.egoDie);
  STATS.forEach(s=>{set('mod-'+s.k,'+'+mod(f.status[s.k]));const b=$(`[data-d="bar-${s.k}"]`);if(b)b.style.width=clamp(+f.status[s.k]||0,0,110)/1.1+'%'});
  const r=$('[data-d="radar"]');if(r)r.innerHTML=radar(f.status,{size:240});
  const ps=sumStats(f.status);const pb=$('[data-d="psbar"]');
  if(pb){pb.style.width=clamp(ps/CRIACAO.ps*100,0,100)+'%';pb.style.background=ps>CRIACAO.ps?'var(--red)':ps===CRIACAO.ps?'var(--green)':'var(--lock)';
    const acima=STATS.filter(s=>+f.status[s.k]>CRIACAO.max).map(s=>s.s);
    set('ps',`${ps} / ${CRIACAO.ps}${acima.length?` · acima de ${CRIACAO.max}: ${acima.join(', ')}`:''}`);}
  const ti=$('[data-d="tecinfo"]');if(ti){const n=Object.values(f.tecnicas||{}).filter(v=>+v>0).length;ti.textContent=`${n} de ${CRIACAO.treinadas} técnicas treinadas na criação.`;ti.style.color=n>CRIACAO.treinadas?'var(--red)':''}
  const fb=$('[data-d="folbar"]');if(fb){const v=fol(f);fb.classList.toggle('low',v<dv.folMax*.3);fb.querySelector('i').style.width=v/dv.folMax*100+'%';fb.querySelector('em').textContent=`${v} / ${dv.folMax}`}
}

function forjaArma(arma,{titulo='Forjar arma',limite=null,onSave,item=false}={}){
  const a=JSON.parse(JSON.stringify(arma||{}));a.efeitos=a.efeitos||[];
  if(a.custoAuto==null)a.custoAuto=!arma||!!arma.gatilhoTipo||!!(arma.efeitos||[]).length;
  const box=modal(`<h2>${titulo}</h2><div id="forja"></div>`,{wide:true});
  const draw=()=>{
    const calc=custoCalc(a);if(a.custoAuto)a.custoFolego=calc;
    const peCalc=a.efeitos.some(k=>efeito(k)?.pe);
    box.querySelector('#forja').innerHTML=`
      <div class="grid2"><div class="field"><label class="l">Nome da arma</label><input class="f" data-k="nome" value="${esc(a.nome||'')}" placeholder="Ex.: Chute Direto"></div>
      <div class="field"><label class="l">Custo</label><div class="row"><input class="f num" type="number" data-k="custoFolego" value="${a.custoFolego||0}" style="width:90px" ${a.custoAuto?'readonly':''} aria-label="Custo em fôlego"><span>Fôlego</span><input class="f num" type="number" data-k="custoPE" value="${a.custoPE||0}" style="width:70px" aria-label="Custo em PE"><span>PE</span><label class="switch small"><input type="checkbox" data-k="custoAuto" ${a.custoAuto?'checked':''}> Calcular pela tabela</label></div></div></div>
      <label class="l">1. Gatilho de ativação</label>
      <div class="pick" style="margin-bottom:8px">${GATILHOS.map(g=>`<button class="pickopt ${a.gatilhoTipo===g.k?'on':''}" data-g="${g.k}"><b>${g.n}<span>${g.c>0?'+':''}${g.c||'±0'}</span></b><small>${g.d}</small></button>`).join('')}</div>
      <div class="field"><input class="f" data-k="gatilho" value="${esc(a.gatilho||'')}" placeholder="Descreva o gatilho na sua jogada (opcional)"></div>
      <label class="l">2. Efeitos ${limite?`— seu Overall permite ${limite}`:''} <span style="color:${limite&&a.efeitos.length>limite?'var(--red)':'inherit'}">(${a.efeitos.length} escolhido${a.efeitos.length===1?'':'s'})</span></label>
      ${['Potência','Controle','Supressão'].map(gp=>{const list=todosEfeitos().filter(e=>e.g===gp);return list.length?`<div style="margin-bottom:8px"><b style="font-family:var(--display);color:${GRUPO_COR[gp]}">${gp}</b><div class="pick" style="margin-top:4px">${list.map(e=>`<button class="pickopt ${a.efeitos.includes(e.k)?'on':''}" data-e="${e.k}"><b>${esc(e.n)}<span>+${e.c}${e.pe?'/PE':''}</span></b><small>${esc(e.d)}</small></button>`).join('')}</div></div>`:''}).join('')}
      <div class="field"><label class="l">3. Descrição do efeito</label><textarea class="f" data-k="efeito" placeholder="Como a arma aparece em campo e o que muda na jogada.">${esc(a.efeito||'')}</textarea></div>
      <div class="spread"><span class="muted small">Custo pela tabela: <b class="num" style="font-size:18px;color:var(--ink)">${calc} Fôlego</b>${peCalc?' (ou 1 PE em efeitos marcados)':''}</span>
      <div class="row"><button class="btn" data-x="cancel">Cancelar</button><button class="btn go" data-x="save">Salvar arma</button></div></div>`;
  };
  draw();
  box.addEventListener('input',ev=>{const k=ev.target.dataset.k;if(!k)return;if(k==='custoAuto'){a.custoAuto=ev.target.checked;draw();return}a[k]=ev.target.type==='number'?+ev.target.value:ev.target.value});
  box.addEventListener('click',ev=>{
    const g=ev.target.closest('[data-g]'),e=ev.target.closest('[data-e]'),x=ev.target.closest('[data-x]');
    if(g){a.gatilhoTipo=a.gatilhoTipo===g.dataset.g?'':g.dataset.g;draw()}
    if(e){const k=e.dataset.e;a.efeitos=a.efeitos.includes(k)?a.efeitos.filter(z=>z!==k):[...a.efeitos,k];draw()}
    if(x?.dataset.x==='cancel')closeModal();
    if(x?.dataset.x==='save'){if(!String(a.nome||'').trim()){toast('Dê um nome para a arma.');return}if(!a.id)a.id=uid();onSave(a);closeModal()}
  });
}

};
function entradaCard(x){
  const t=TIPOS_BIB.find(t=>t.k===x.tipo)||TIPOS_BIB[0];const meu=DB.mine(x)&&!x.oficial;
  let corpo='';
  if(x.tipo==='Arma')corpo=armaCard(x).replace('class="weapon"','class="weapon" style="background:none;border:0;padding:0;margin:0"').replace(/<h4>.*?<\/h4>/,'<span></span>');
  else if(x.tipo==='Propriedade')corpo=`<p style="margin:0">${esc(x.descricao)}</p><div class="row"><span class="chip" style="border-color:${GRUPO_COR[x.grupo]||'var(--line)'}">${esc(x.grupo||'Potência')}</span><span class="costpill">+${x.custoFolego||0} Fôlego${x.custoPE?' ou 1 PE':''}</span></div>`;
  else corpo=`<p style="margin:0">${esc(x.descricao)}</p>${x.bonus?`<p class="small" style="margin:0"><b>Efeito:</b> ${esc(x.bonus)}</p>`:''}<span class="chip">${esc(x.categoria||'Equipamento')}</span>`;
  return `<article class="libitem" style="--kc:${t.c}">
    <div class="spread"><span class="small" style="font-weight:700;color:${t.c}">${x.tipo}</span><span class="small muted">${x.oficial?'Livro':'por '+esc(x.autorNome||'você')}</span></div>

    <div class="spread" style="margin-top:auto;padding-top:6px">
      ${meu?`<label class="switch"><input type="checkbox" data-act-change="publicarBib" data-id="${x.id}" ${x.publicado?'checked':''}> Publicado</label>`:'<span></span>'}
      <div class="row" style="gap:6px">${x.tipo!=='Propriedade'?`<button class="btn sm" data-act="bibParaFicha" data-id="${x.id}">Usar numa ficha</button>`:''}${meu?`<button class="btn sm" data-act="editarEntrada" data-id="${x.id}">Editar</button><button class="btn sm danger ghost" data-act="excluirEntrada" data-id="${x.id}" aria-label="Excluir">×</button>`:''}</div>
    </div></article>`;
}
function editarEntrada(x){
  if(x.tipo==='Arma'){forjaArma(x,{titulo:x.id?'Editar arma':'Forjar arma',onSave:a=>{DB.upsert('biblioteca',{...x,...a,tipo:'Arma'});rerender();toast('Arma salva na biblioteca.')}});return}
  const prop=x.tipo==='Propriedade';
  const box=modal(`<h2>${x.id?'Editar':'Nova'} ${prop?'propriedade':'item'}</h2>
    <div class="field"><label class="l">Nome</label><input class="f" id="eN" value="${esc(x.nome||'')}"></div>
    ${prop?`<div class="grid3"><div class="field"><label class="l">Grupo</label><select class="f" id="eG">${['Potência','Controle','Supressão'].map(g=>`<option ${x.grupo===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label class="l">Custo (Fôlego)</label><input class="f" type="number" id="eC" value="${x.custoFolego??10}"></div><div class="field"><label class="l">Alternativa em PE</label><select class="f" id="eP"><option value="0">Não</option><option value="1" ${x.custoPE?'selected':''}>Ou 1 PE</option></select></div></div>
     <p class="small muted">Referência do livro: efeitos simples custam 10, fortes 15 e os mais poderosos 20 (ou 1 PE).</p>`
    :`<div class="grid2"><div class="field"><label class="l">Categoria</label><select class="f" id="eG">${['Equipamento','Acessório','Consumível','Treino'].map(g=>`<option ${x.categoria===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label class="l">Efeito em jogo</label><input class="f" id="eB" value="${esc(x.bonus||'')}" placeholder="Ex.: +1 em Aceleração"></div></div>`}
    <div class="field"><label class="l">Descrição</label><textarea class="f" id="eD">${esc(x.descricao||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x="c">Cancelar</button><button class="btn go" data-x="s">Salvar</button></div>`);
  box.addEventListener('click',ev=>{const b=ev.target.closest('[data-x]');if(!b)return;if(b.dataset.x==='c')return closeModal();
    const nome=box.querySelector('#eN').value.trim();if(!nome)return toast('Dê um nome.');
    const o={...x,nome,descricao:box.querySelector('#eD').value};
    if(prop){o.grupo=box.querySelector('#eG').value;o.custoFolego=+box.querySelector('#eC').value||0;o.custoPE=+box.querySelector('#eP').value}
    else{o.categoria=box.querySelector('#eG').value;o.bonus=box.querySelector('#eB').value}
    DB.upsert('biblioteca',o);closeModal();rerender();toast('Salvo na biblioteca.');});
}
function escolherFicha(titulo,cb,filtro=()=>true){
  const fs=DB.list('fichas',filtro);
  if(!fs.length){toast('Crie uma ficha primeiro.');return}
  const box=modal(`<h2>${titulo}</h2><div class="list">${fs.map(f=>`<button class="mini" style="cursor:pointer;text-align:left" data-pf="${f.id}">${avatar(f)}<div class="grow"><b>${esc(f.nome)}</b><div class="small muted">${f.tipo==='npc'?'Rival':'Jogador'} · OVR ${overall(f.status)}</div></div></button>`).join('')}</div>`);
  box.addEventListener('click',e=>{const b=e.target.closest('[data-pf]');if(b){closeModal();cb(DB.get('fichas',b.dataset.pf))}});
}

function formCampanha(c={}){
  let cor=c.cor||CORES_CAMP[0];
  const box=modal(`<h2>${c.id?'Editar campanha':'Nova campanha'}</h2>
    <div class="field"><label class="l">Nome</label><input class="f" id="cN" value="${esc(c.nome||'')}" placeholder="Ex.: Seleção — 2ª fase" maxlength="60"></div>
    <div class="field"><label class="l">Descrição</label><textarea class="f" id="cD" placeholder="Premissa, regras da casa, objetivo da temporada…">${esc(c.descricao||'')}</textarea></div>
    <label class="l">Cor da campanha</label><div class="row" id="cC" style="gap:6px;margin-bottom:16px">${CORES_CAMP.map(k=>`<button data-c="${k}" aria-label="Cor ${k}" style="width:34px;height:34px;border-radius:3px;border:3px solid ${k===cor?'var(--cyan)':'transparent'};background:${k};cursor:pointer"></button>`).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x="c">Cancelar</button><button class="btn go" data-x="s">${c.id?'Salvar':'Criar campanha'}</button></div>`);
  box.addEventListener('click',e=>{
    const k=e.target.closest('[data-c]');if(k){cor=k.dataset.c;box.querySelectorAll('[data-c]').forEach(b=>b.style.borderColor=b.dataset.c===cor?'var(--cyan)':'transparent')}
    const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='c')return closeModal();
    const nome=box.querySelector('#cN').value.trim();if(!nome)return toast('Dê um nome para a campanha.');
    const descricao=box.querySelector('#cD').value;
    if(c.id){Object.assign(c,{nome,descricao,cor});DB.upsert('campanhas',c);closeModal();rerender();return}
    x.disabled=true;x.textContent='Criando…';
    DB.criarCampanha(nome,descricao,cor).then(n=>{closeModal();go('#/campanha/'+n.id)}).catch(err=>{x.disabled=false;x.textContent='Criar campanha';toast('Não foi possível criar: '+err.message)});
  });
}

    <div class="row">${mestre?`<a class="btn go" href="#/escudo/${c.id}">Escudo do Mestre</a><button class="btn" data-act="partidaDaCamp">${p&&p.campanhaId===c.id?'Voltar à partida':'Simular partida'}</button>`:'<span class="chip" style="background:#fff;color:#000">Você é jogador nesta campanha</span>'}</div></div>
    <p style="margin:12px 0 0;max-width:70ch;opacity:.92">${esc(c.descricao||'Sem descrição.')}</p>
  </header>
  ${p&&p.campanhaId===c.id?`<div class="panel" style="margin-bottom:18px;border-left:6px solid var(--gold)"><div class="spread"><b>Partida em andamento: ${esc(p.times.A.nome)} ${p.times.A.gols} × ${p.times.B.gols} ${esc(p.times.B.nome)} · rodada ${p.rodada}</b><a class="btn sm go" href="#/partida">Abrir partida</a></div></div>`:''}
  <div class="homegrid">
    <div style="display:grid;gap:18px">
      <section class="panel"><h3>Notas do Mestre</h3><textarea class="f" ${mestre?'':'readonly'} data-c="notas" style="min-height:140px" placeholder="Ganchos, próximos rivais, regras da casa…">${esc(c.notas||'')}</textarea></section>
      <section class="panel"><h3>Histórico de partidas</h3>${(c.partidas||[]).length?`<div class="list">${c.partidas.slice().reverse().map(h=>`<div class="mini"><div class="grow"><b>${esc(h.A)} ${h.ga} × ${h.gb} ${esc(h.B)}</b><div class="small muted">${new Date(h.t).toLocaleDateString('pt-BR')} · ${h.rodadas} rodadas${h.mvp?' · MVP '+esc(h.mvp):''}</div></div></div>`).join('')}</div>`:'<p class="muted">As partidas encerradas no simulador aparecem aqui.</p>'}</section>
      <section class="panel"><h3>Rolagens recentes</h3>${rolls.length?`<div class="log">${rolls.map(r=>`<div><em>${new Date(r.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</em><b>${esc(r.nome)}</b> — ${esc(r.tec)}: <b>${r.total}</b> <span class="muted">[${r.dados.join(', ')}]</span></div>`).join('')}</div>`:'<p class="muted">Rolagens feitas nas fichas desta campanha aparecem aqui.</p>'}</section>
    </div>
    <div style="display:grid;gap:18px;align-content:start">

      <div class="row">${mestre?'<button class="btn sm" data-act="editarCamp">Editar campanha</button><button class="btn sm danger" data-act="excluirCamp">Excluir campanha</button>':'<button class="btn sm danger" data-act="sairCamp">Sair da campanha</button>'}</div>

/* =========================================================
   SIMULADOR DE PARTIDA — focado nas fichas (o mapa fica no Owlbear)
   ========================================================= */
const TEAM_COR={A:'var(--lock)',B:'var(--red)'};
function setupPartida(){
  return ROUTES.partida.setup||(ROUTES.partida.setup={campanhaId:'',A:{nome:'Blue Lock',sel:{}},B:{nome:'Rivais',sel:{}},penal:3,cansaco:true,escudo:true});
}
function prefillDaCampanha(c){
  const s=setupPartida();s.campanhaId=c.id;s.A={nome:'Blue Lock',sel:{}};s.B={nome:'Rivais',sel:{}};s.escudo=true;
  (c.jogadores||[]).forEach(i=>{if(DB.get('fichas',i))s.A.sel[i]=1});
  (c.rivais||[]).forEach(i=>{if(DB.get('fichas',i))s.B.sel[i]=1});
}
ROUTES.partida=()=>DB.data.partida?viewPartida():viewSetup();
function viewSetup(){
  const s=setupPartida();const camps=DB.list('campanhas',c=>c.ownerId===DB.data.user.id);
  const fichas=DB.list('fichas').sort((a,b)=>(a.tipo>b.tipo?1:-1)||overall(b.status)-overall(a.status));
  const total=t=>Object.values(s[t].sel).reduce((a,b)=>a+b,0);
  const team=t=>`<section class="panel teamcol" style="--tc:${TEAM_COR[t]}">
     <input class="f" style="font:800 26px var(--display);border:0;background:none;padding:0;margin-bottom:10px" data-ms="${t}" value="${esc(s[t].nome)}" aria-label="Nome do time ${t}">
     <div class="list">${Object.entries(s[t].sel).map(([id,q])=>{const f=DB.get('fichas',id);if(!f)return '';return `<div class="pickrow"><div style="min-width:0"><b style="font-family:var(--display);font-size:19px">${esc(f.nome)}</b> <span class="small muted">OVR ${overall(f.status)}</span></div>
       ${f.tipo==='npc'?`<span class="qty"><button class="btn xs" data-act="mQty" data-t="${t}" data-id="${id}" data-v="-1">−</button><b>${q}</b><button class="btn xs" data-act="mQty" data-t="${t}" data-id="${id}" data-v="1">+</button></span>`:'<span></span>'}<span></span>
       <button class="btn xs ghost" data-act="mQty" data-t="${t}" data-id="${id}" data-v="-99" aria-label="Remover">×</button></div>`}).join('')||'<p class="muted small">Adicione fichas pela lista abaixo.</p>'}</div>
     <p class="small muted" style="margin:10px 0 0">${plural(total(t),'participante','participantes')}</p></section>`;
  return `<div class="pagehead"><div><h1>Simular partida</h1><p>Monte os dois times. O simulador cuida da iniciativa, das ações por turno, do Fôlego, das disputas e dos PT no final. O mapa fica com você no Owlbear.</p></div>
    <div class="row"><select class="f" style="width:240px" data-act-change="mCamp"><option value="">Sem campanha</option>${camps.map(c=>`<option value="${c.id}" ${s.campanhaId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select><button class="btn go" data-act="mIniciar" ${total('A')&&total('B')?'':'disabled'}>Começar partida</button></div></div>
  <div class="grid2" style="margin-bottom:18px">${team('A')}${team('B')}</div>
  <section class="panel">
    <div class="spread"><h3>Fichas disponíveis</h3><div class="row"><label class="small">Penalidade de Intimidado <input class="f num" type="number" min="0" max="10" style="width:64px;display:inline-block" data-ms="penal" value="${s.penal}"></label><label class="switch small"><input type="checkbox" data-ms="cansaco" ${s.cansaco?'checked':''}> Aplicar cansaço dos treinos</label><label class="switch small"><input type="checkbox" data-ms="escudo" ${s.escudo?'checked':''}> Mesclar Escudo do Mestre</label></div></div>

    :`<div class="empty"><h3>Sem fichas para escalar</h3><p>Crie jogadores e rivais primeiro.</p><div class="row" style="justify-content:center"><button class="btn go" data-act="novaFicha" data-tipo="jogador">Criar jogador</button><button class="btn" data-act="rivalDeEstilo">Gerar rival</button></div></div>`}

function iniciarPartida(){
  const s=setupPartida();const parts={};
  ['A','B'].forEach(t=>{
    Object.entries(s[t].sel).forEach(([id,q])=>{const f=DB.get('fichas',id);if(!f)return;
      for(let n=0;n<q;n++){const dv=derived(f);let folego=f.tipo==='jogador'?fol(f):dv.folMax;
        if(f.tipo==='jogador'&&s.cansaco&&f.cansaco)folego=Math.max(0,dv.folMax-f.cansaco);
        const p={iid:uid(),fichaId:f.id,tipo:f.tipo,nome:q>1?`${f.nome} ${n+1}`:f.nome,num:f.numero||'',imagem:f.imagem||'',team:t,
          status:{...f.status},tecnicas:{...f.tecnicas},armas:JSON.parse(JSON.stringify(f.armas||[])),ov:dv.o,folMax:dv.folMax,folego,peMax:dv.peMax,pe:f.tipo==='jogador'?pe(f):dv.peMax,ini:dv.ini,egoDie:dv.egoDie,zona:dv.zona,
          cond:[...(f.condicoes||[])].filter(c=>c!=='Intimidado'),acoes:{livre:2,desl:1,princ:1,reac:1},st:{gols:0,assist:0,bloq:0},bonusNext:0,egoFree:0,out:false};
        parts[p.iid]=p;}
    });
  });
  Object.values(parts).forEach(p=>{if(p.tipo==='jogador'){const f=DB.get('fichas',p.fichaId);if(f){if(s.cansaco)f.cansaco=0;f.folegoAtual=p.folego;f.peAtual=p.pe;DB.upsert('fichas',f)}}});
  const ordem=Object.values(parts).sort((a,b)=>b.ini-a.ini||b.ov-a.ov||Math.random()-.5).map(p=>p.iid);
  DB.data.partida={id:uid(),campanhaId:s.campanhaId||'',times:{A:{nome:s.A.nome||'Time A',gols:0},B:{nome:s.B.nome||'Time B',gols:0}},rodada:1,turno:0,ordem,parts,posse:null,
    penal:+s.penal||0,escudo:!!s.escudo,log:[],sel:ordem[0],duel:null,t0:Date.now()};
  const pa=parts[ordem[0]];

const M_=()=>DB.data.partida;
function logM(txt,cls=''){const M=M_();M.log.unshift({t:Date.now(),r:M.rodada,txt,cls});M.log=M.log.slice(0,150)}
const atual=()=>{const M=M_();return M.parts[M.ordem[M.turno]]};
function intimidadoPassivo(p){const M=M_();return Object.values(M.parts).some(o=>o.team!==p.team&&!o.out&&o.ov-p.ov>=20)}
function syncFicha(p){if(p.tipo!=='jogador')return;const f=DB.get('fichas',p.fichaId);if(!f)return;if(f.folegoAtual===p.folego&&f.peAtual===p.pe)return;f.folegoAtual=p.folego;f.peAtual=p.pe;DB.upsert('fichas',f)}
function mudarFolego(p,v){p.folego=clamp(v==='max'?p.folMax:p.folego+(+v),0,p.folMax);syncFicha(p)}
function oponente(p){const M=M_();const op=Object.values(M.parts).filter(o=>o.team!==p.team&&!o.out);return op.find(o=>o.iid===M.posse)||op[0]}
function proximoTurno(){
  const M=M_();const n=M.ordem.length;let guard=0;
  do{M.turno++;if(M.turno>=n){M.turno=0;M.rodada++;Object.values(M.parts).forEach(p=>p.acoes.reac=1);logM(`Rodada ${M.rodada}.`)}guard++}while(atual().out&&guard<=n);
  const a=atual();a.acoes.livre=2;a.acoes.desl=1;a.acoes.princ=1;M.sel=a.iid;
  if(M.duel){M.duel.a=a.iid;M.duel.res=null;const o=M.parts[M.duel.d];if(!o||o.team===a.team)M.duel.d=oponente(a)?.iid||''}
  logM(`Vez de ${a.nome}.`);DB.saveSoon();rerender();
}
function melhorTec(p,lista){return lista.slice().sort((x,y)=>(NIVEIS[+(p.tecnicas[y]||0)].b+mod(p.status[TEC_STAT[y]]))-(NIVEIS[+(p.tecnicas[x]||0)].b+mod(p.status[TEC_STAT[x]])))[0]}
const PRESETS=[
 {n:'Drible × Desarme',a:['Drible'],d:['Desarme']},

];
function duelo(){
  const M=M_();
  if(!M.duel||!M.parts[M.duel.a]){const a=atual();M.duel={a:a.iid,ta:'Drible',ba:0,ea:false,d:oponente(a)?.iid||'',td:'Desarme',bd:0,ed:false,res:null}}
  return M.duel;
}
function gastarEgo(p,quer){
  if(p.egoFree>0){p.egoFree--;return true}
  if(!quer)return false;
  if(p.pe>0){p.pe--;return true}
  toast(`${p.nome} está sem PE para o Dado de Ego.`);return false;
}
function rolarDuelo(){
  const M=M_(),D=duelo();const A=M.parts[D.a],B=D.d?M.parts[D.d]:null;
  if(!A){toast('Escolha quem faz a jogada.');return}
  const lado=(p,tec,bon,ego,o)=>{
    const usarEgo=gastarEgo(p,ego);
    const intim=(p.cond.includes('Intimidado')||(o&&o.ov-p.ov>=20));
    const r=rolar({nome:p.nome,status:p.status,tecnicas:p.tecnicas,tec,extra:(+bon||0)+p.bonusNext,ego:usarEgo,egoDie:p.egoDie,penal:intim?M.penal:0,ov:p.ov,fichaId:p.fichaId,fonte:'partida'});
    p.bonusNext=0;syncFicha(p);return r;
  };
  const ra=lado(A,D.ta,D.ba,D.ea,B);const rb=B?lado(B,D.td,D.bd,D.ed,A):null;
  let win='a';if(rb){win=ra.total>rb.total?'a':rb.total>ra.total?'d':A.ov>B.ov?'a':B.ov>A.ov?'d':'tie'}
  const cur=atual();
  if(A.iid===cur.iid)A.acoes.princ=0;else A.acoes.reac=0;
  if(B&&B.iid!==cur.iid)B.acoes.reac=0;
  D.res={ra,rb,win,desempate:rb&&ra.total===rb.total};
  logM(rb?`${A.nome} (${D.ta} ${ra.total}) × ${B.nome} (${D.td} ${rb.total}): ${win==='a'?A.nome:win==='d'?B.nome:'empate total'} vence${D.res.desempate&&win!=='tie'?' no desempate por Overall':''}.`:`${A.nome} rolou ${D.ta}: ${ra.total}.`);
  DB.saveSoon();rerender();
}

function registrarGol(iid){

  box.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='c')return closeModal();
    const sc=M.parts[box.querySelector('#gS').value],as=M.parts[box.querySelector('#gA').value];
    sc.st.gols++;M.times[sc.team].gols++;if(as)as.st.assist++;

function usarArmaPartida(p,aid){
  const a=p.armas.find(x=>x.id===aid);if(!a)return;
  if(p.folego<(a.custoFolego||0))toast(`${p.nome} não tem Fôlego suficiente — aplicado mesmo assim.`);

  const extra=[];(a.efeitos||[]).forEach(k=>{const e=efeito(k);if(!e)return;if(e.bonus){p.bonusNext+=e.bonus;extra.push('+'+e.bonus+' no próximo teste')}if(e.egoFree){p.egoFree++;extra.push('Dado de Ego grátis')}});
  if(p.acoes.livre>0)p.acoes.livre--;
  logM(`${p.nome} usou ${a.nome} (−${a.custoFolego||0} Fôlego${a.custoPE?`, −${a.custoPE} PE`:''})${extra.length?': '+extra.join(', '):''}.`);

}

function encerrarPartida(){
  const M=M_();const P=Object.values(M.parts);
  const box=modal(`<h2>Fim de jogo</h2><p class="num" style="font-size:34px;margin:0 0 12px">${esc(M.times.A.nome)} ${M.times.A.gols} × ${M.times.B.gols} ${esc(M.times.B.nome)}</p>
    <div class="field"><label class="l">MVP da partida</label><select class="f" id="mvp"><option value="">Sem MVP</option>${P.map(p=>`<option value="${p.iid}">${esc(p.nome)}</option>`).join('')}</select></div>
    <div id="ptres"></div>
    <div class="spread" style="margin-top:14px"><button class="btn danger ghost" data-x="d">Descartar sem salvar</button><div class="row"><button class="btn" data-x="c">Continuar jogando</button><button class="btn go" data-x="s">Encerrar e aplicar PT</button></div></div>`,{wide:true});
  const calc=()=>{const mvp=box.querySelector('#mvp').value;return P.filter(p=>p.tipo==='jogador').map(p=>{
    const g=M.times[p.team].gols,o=M.times[p.team==='A'?'B':'A'].gols;const r=g>o?'vitoria':g===o?'empate':'derrota';
    const it=[[r==='vitoria'?'Vitória':r==='empate'?'Empate':'Derrota',PT_GANHOS[r]]];
    if(p.st.gols)it.push([plural(p.st.gols,'gol','gols'),p.st.gols*PT_GANHOS.gol]);if(p.st.assist)it.push([plural(p.st.assist,'assistência','assistências'),p.st.assist*PT_GANHOS.assist]);
    if(p.st.bloq)it.push([plural(p.st.bloq,'bloqueio crucial','bloqueios cruciais'),p.st.bloq*PT_GANHOS.bloqueio]);if(mvp===p.iid)it.push(['MVP',PT_GANHOS.mvp]);
    return {p,it,total:it.reduce((s,x)=>s+x[1],0)}})};
  const draw=()=>{const L=calc();box.querySelector('#ptres').innerHTML=L.length?`<table class="efftable"><thead><tr><th>Jogador</th><th>Ganhos</th><th>PT</th></tr></thead><tbody>${L.map(l=>`<tr><td><b>${esc(l.p.nome)}</b></td><td>${l.it.map(x=>`${esc(x[0])} +${x[1]}`).join(' · ')}</td><td class="num" style="font-size:22px">+${l.total}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Nenhuma ficha de jogador em campo — nada de PT para distribuir.</p>'};
  draw();box.querySelector('#mvp').addEventListener('change',draw);
  box.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;
    if(x.dataset.x==='c')return closeModal();
    if(x.dataset.x==='d'){if(!confirmar('Descartar a partida? Placar e PT não serão salvos.'))return;DB.data.partida=null;DB.save();closeModal();rerender();return}
    const L=calc();const mvpI=box.querySelector('#mvp').value;
    L.forEach(l=>{const f=DB.get('fichas',l.p.fichaId);if(!f)return;f.pt=(+f.pt||0)+l.total;f.ptLog=[`Partida ${M.times.A.nome} ${M.times.A.gols}×${M.times.B.gols} ${M.times.B.nome}: +${l.total} PT`,...(f.ptLog||[])].slice(0,30);f.folegoAtual=l.p.folego;f.peAtual=l.p.pe;DB.upsert('fichas',f)});
    const c=M.campanhaId&&DB.get('campanhas',M.campanhaId);
    if(c){c.partidas=[...(c.partidas||[]),{t:Date.now(),A:M.times.A.nome,B:M.times.B.nome,ga:M.times.A.gols,gb:M.times.B.gols,rodadas:M.rodada,mvp:M.parts[mvpI]?.nome||''}];DB.upsert('campanhas',c)}
    DB.data.partida=null;ROUTES.partida.setup=null;DB.save();closeModal();toast(L.length?'PT aplicados nas fichas.':'Partida encerrada.');
    go(c?'#/campanha/'+c.id:'#/partida');
  });
}
